name: academy_app
description: A new Flutter project.
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=2.19.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  provider: ^6.0.3
  http: ^0.13.4
  shared_preferences: ^2.0.15
  json_serializable: ^6.3.1
  fluttertoast: ^8.0.9
  cached_network_image: ^3.2.1
  flutter_downloader: ^1.8.1
  share: ^2.0.4
  flutter_staggered_grid_view: ^0.6.2
  percent_indicator: ^4.2.2
  material_design_icons_flutter: ^6.0.7096
  image_picker: ^0.8.5+3
  permission_handler: ^10.2.0
  file_utils: ^1.0.1
  url_launcher: ^6.1.5
  intl: ^0.18.0
  path_provider: ^2.0.11
  sqflite: ^2.0.3
  connectivity_plus: ^3.0.3
  html_unescape: ^2.0.0
  universal_html: ^2.0.8
  visibility_detector: ^0.4.0+2
  webview_flutter: ^4.0.6

  # Nova dependência de vídeo
  video_player: ^2.6.0
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash.png
    - assets/images/login_forget.png
    - assets/images/do_login.png
    - assets/images/long_arrow_right.png
    - assets/images/loading_animated.gif
    - assets/images/play.png
    - assets/images/no_connection.png

  fonts:
    - family: google_sans
      fonts:
        - asset: assets/fonts/google_sans_regular.ttf
        - asset: assets/fonts/google_sans_bold.ttf
          weight: 700
